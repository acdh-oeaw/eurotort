[project]
name = "eurotort"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "acdh-django-browsing>=4.1.1",
    "acdh-django-widgets>=0.1.0",
    "django>=6.0.6",
    "django-autocomplete-light>=5.0.0",
    "django-next-prev>=1.1.0",
    "django-spaghetti-and-meatballs>=0.4.2",
    "gunicorn>=26.2.0",
    "pandas>=2.3.3",
    "psycopg2-binary>=2.9.11",
    "requests>=2.32.5",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "coverage>=7.13.4",
    "django-extensions>=4.1",
    "jupyterlab>=4.4.10",
    "notebook>=7.4.7",
    "ruff>=0.16.8",
]

[tool.ruff]

exclude = ["notebooks/"]

[tool.ruff.lint]
ignore = ["RUF012", "BLE001", "TRY002", "EXE001", "SIM102"]
